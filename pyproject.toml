[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iplens"
version = "0.1.0"
description = "Local web app for private IPv4 usage visibility & optimization in a single AWS account"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "boto3>=1.34",
    "pyyaml>=6.0",
    "cryptography>=42",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "moto[ec2,ecs,lambda,elbv2,sts,iam,sns,sqs,dynamodb,s3,stepfunctions,secretsmanager,events,logs,cloudformation,resourcegroupstaggingapi,cloudtrail]>=5.0",
    "ruff>=0.5",
]

[project.scripts]
iplens = "iplens.cli:main"

[tool.setuptools.packages.find]
include = ["iplens*"]

[tool.setuptools.package-data]
iplens = [
    "templates/*.html",
    "static/*.css",
    "static/*.js",
    "static/vendor/*",
    "static/icons/aws/*.svg",
    "static/icons/ext/*.svg",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
