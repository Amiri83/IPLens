[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-iplens"
# Single source of truth for the version; iplens.__version__ reads the installed metadata.
version = "1.0.0"
description = "Local web app for private IPv4 usage visibility & optimization across AWS accounts"
readme = "README.md"
authors = [{ name = "Amir Amiri" }]
requires-python = ">=3.11"
keywords = ["aws", "vpc", "ipv4", "subnet", "eni", "network", "visualization"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "flask>=3.0",
    "boto3>=1.34",
    "pyyaml>=6.0",
    "cryptography>=42",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "moto[ec2,ecs,lambda,elbv2,sts,iam,sns,sqs,dynamodb,s3,stepfunctions,secretsmanager,events,logs,cloudformation,resourcegroupstaggingapi,cloudtrail]>=5.0",
    "ruff>=0.5",
    "playwright>=1.40",
    "build>=1.2",
    "twine>=6.1",
]

[project.urls]
Homepage = "https://github.com/Amiri83/IPLens"
Source = "https://github.com/Amiri83/IPLens"
Issues = "https://github.com/Amiri83/IPLens/issues"

[project.scripts]
iplens = "iplens.cli:main"

[tool.setuptools.packages.find]
include = ["iplens*"]

[tool.setuptools.package-data]
iplens = [
    "templates/*.html",
    "static/*.css",
    "static/*.js",
    "static/*.svg",
    "static/vendor/*",
    "static/icons/aws/*.svg",
    "static/icons/ext/*.svg",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
