name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      # The browser test must run here: a missing Playwright / Chromium fails instead of skipping.
      IPLENS_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m playwright install --with-deps chromium
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        # Each failing test also becomes an annotation (readable without the raw log).
        run: |
          set -o pipefail
          python -m pytest -q -rfE 2>&1 | tee pytest.out || {
            grep -E "^(FAILED|ERROR) " pytest.out | head -20 | sed 's/^/::error::/'
            grep -E "^E  " pytest.out | head -10 | sed 's/^/::error::/'
            exit 1
          }
      - name: CLI
        run: iplens --version

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install the wheel and run it
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "$(/tmp/wheel-venv/bin/iplens --version)" = "iplens $version"
          /tmp/wheel-venv/bin/python -c "import importlib.resources as r; assert (r.files('iplens') / 'static/favicon.svg').is_file()"
          /tmp/wheel-venv/bin/iplens mcp --help > /dev/null  # the MCP SDK is a core dependency
          wheel=$(ls dist/*.whl)
          /tmp/wheel-venv/bin/pip install "${wheel}[mcp]"  # the old extra, now empty, still installs
